name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      # Device names change with every runner image, so resolve one instead of
      # hardcoding a model and having CI break on an image bump.
      # Every line here stays indented inside the block scalar: a line at a
      # smaller indent ends the block, and YAML then tries to parse the script
      # itself.
      - name: Resolve a simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | jq -r '
            [ .devices
              | to_entries[]
              | select(.key | test("iOS"))
              | .value[]
              | select(.name | startswith("iPhone"))
            ]
            | last
            | .udid // empty
          ')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available on this image:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Resolved $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # A simulator rather than `swift test` on macOS: several targets are UIKit
      # only, and the network capture this suite guards is CFNetwork behaviour
      # that differs between OS versions -- the iOS 26 `protocolClasses` swizzle
      # crash fixed in 1.1.0 was exactly that, and it was invisible until the
      # code ran on a real iOS runtime.
      - name: Run tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme KVLoggingKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -quiet

  example:
    name: Build example apps
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [SwiftUIExample, UIKitExample]
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      # `generic/platform=iOS` compiles without booting a simulator: this job is
      # here to catch API breaks the package's own tests cannot see, since the
      # examples are the only consumers of the public surface.
      - name: Build ${{ matrix.scheme }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Examples/KVLoggingKitExample/KVLoggingKitExample.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
